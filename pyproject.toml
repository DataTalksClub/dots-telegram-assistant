[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dots-telegram-events"
version = "0.2.0"
description = "Owner-only Telegram transport for an MCP Events-enabled dot"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]==2.15.1"]

[project.scripts]
dots-telegram-events = "telegram_events.__main__:main"

[tool.setuptools.packages.find]
include = ["telegram_events*"]
