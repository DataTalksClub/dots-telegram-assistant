[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dots-telegram-assistant"
version = "0.1.0"
description = "A separate, allowlisted Telegram assistant using OpenAI Responses"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dots-telegram-assistant = "telegram_assistant.app:main"

[tool.setuptools.packages.find]
include = ["telegram_assistant*"]
