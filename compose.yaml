services:
  telegram-events:
    build: .
    env_file: .env
    environment:
      STATE_PATH: /data/events.sqlite3
      BIND_HOST: 0.0.0.0
      PORT: "8765"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - events-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
volumes:
  events-data:
